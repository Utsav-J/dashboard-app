<div>
  <ul>
    @for (ticket of tickets; track ticket.id){
      <li>
        <app-ticket [data]="ticket" (close)="onCloseTicket(ticket.id)" /> 
      </li>
    } @empty {
      <p>No tickets yet</p>
    }
  </ul>
</div>

<div id="new-ticket">
  <app-new-ticket (add)="addNewTicket($event)" />
</div>
